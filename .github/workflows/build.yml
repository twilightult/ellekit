name: Build ElleKit Rootless

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos & Dependencies
        run: |
          brew install ldid xz dpkg make
          sudo ln -s $(brew --prefix)/opt/make/libexec/gnubin/make /usr/local/bin/make || true
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Generate Makefile and Filter
        run: |
          cat << 'EOF' > Makefile
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64e
          INSTALL_TARGET_PROCESSES = SpringBoard
          THEOS_PACKAGE_SCHEME = rootless

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = ElleKit
          ElleKit_FILES = ellekitc/ellekitc.c ellekitc/JITLess.c ellekitc/routines.s injector/injector.c
          
          ElleKit_CFLAGS = -fobjc-arc -Iellekitc/include -Iinjector -Iellekit/include -fno-modules -w -Wno-error -Wno-implicit-function-declaration
          ElleKit_LDFLAGS = -undefined dynamic_lookup
          ElleKit_FRAMEWORKS = Foundation CoreFoundation

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          cat << 'EOF' > ElleKit.plist
          { Filter = { Bundles = ( "com.apple.springboard" ); }; }
          EOF

      - name: Compile and Manual Package
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          export THEOS_PACKAGE_SCHEME=rootless
          
          make clean all DEBUG=0
          
          mkdir -p layout/var/jb/Library/MobileSubstrate/DynamicLibraries/
          mkdir -p layout/DEBIAN/
          
          find . -name "ElleKit.dylib" -exec cp {} layout/var/jb/Library/MobileSubstrate/DynamicLibraries/ElleKit.dylib \;
          cp ElleKit.plist layout/var/jb/Library/MobileSubstrate/DynamicLibraries/
          
          cat << 'EOF' > layout/DEBIAN/control
          Package: com.evelyneee.ellekit
          Name: ElleKit
          Version: 1.2.1-patched
          Architecture: iphoneos-arm64
          Description: Patched ElleKit for iOS 17.4.1
          Maintainer: Twilight
          Author: Twilight
          Section: Tweaks
          EOF
          
          dpkg-deb -b layout ellekit-patched.deb
          
          echo "=== DEB Contents ==="
          dpkg-deb -c ellekit-patched.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ellekit-theos-rootless
          path: ellekit-patched.deb
