name: Build ElleKit Rootless

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos & Dependencies
        run: |
          brew install ldid xz dpkg make
          sudo ln -s $(brew --prefix)/opt/make/libexec/gnubin/make /usr/local/bin/make || true
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Generate Makefile
        run: |
          cat << 'EOF' > Makefile
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64e
          INSTALL_TARGET_PROCESSES = SpringBoard
          THEOS_PACKAGE_SCHEME = rootless

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = ElleKit
          ElleKit_FILES = ellekitc/ellekitc.c ellekitc/JITLess.c ellekitc/routines.s injector/injector.c
          
          # 强制编译器忽略各种新版报错
          ElleKit_CFLAGS = -fobjc-arc -Iellekitc/include -Iinjector -Iellekit/include -Wno-implicit-function-declaration -Wno-pointer-sign
          ElleKit_FRAMEWORKS = Foundation CoreFoundation

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

      - name: Compile and Package
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          export THEOS_PACKAGE_SCHEME=rootless
          make clean package DEBUG=0 FINALPACKAGE=1
          
          find . -name "*.deb" -exec cp {} ./ellekit-patched.deb \;

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ellekit-theos-rootless
          path: ellekit-patched.deb
