name: Build ElleKit Rootless

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ElleKit via Xcode
        run: |
          xcodebuild -scheme ellekit -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED="NO" CODE_SIGNING_REQUIRED="NO" CODE_SIGN_IDENTITY="" build
          xcodebuild -scheme injector -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED="NO" CODE_SIGNING_REQUIRED="NO" CODE_SIGN_IDENTITY="" build
          xcodebuild -scheme loader -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED="NO" CODE_SIGNING_REQUIRED="NO" CODE_SIGN_IDENTITY="" build
          xcodebuild -scheme launchd -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED="NO" CODE_SIGNING_REQUIRED="NO" CODE_SIGN_IDENTITY="" build

      - name: Package DEB
        run: |
          mkdir -p layout/var/jb/usr/lib/TweakInject/
          mkdir -p layout/var/jb/usr/lib/
          mkdir -p layout/DEBIAN/
          
          find . -name "ElleKit.dylib" -exec cp {} layout/var/jb/usr/lib/TweakInject/ \;
          find . -name "libellekit.dylib" -exec cp {} layout/var/jb/usr/lib/ \;
          
          cat <<EOF > layout/DEBIAN/control
          Package: com.evelyneee.ellekit
          Name: ElleKit
          Version: 1.2-patched
          Architecture: iphoneos-arm64
          Description: Patched ElleKit for iOS 17.4.1
          Maintainer: Twilight
          Author: Twilight
          Section: Tweaks
          EOF
          
          dpkg-deb -b layout ellekit-patched.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ellekit-patched-rootless
          path: ellekit-patched.deb
