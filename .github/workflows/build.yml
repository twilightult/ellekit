name: Build ElleKit Rootless with Theos

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos & Dependencies
        run: |
          # Install required tools
          brew install ldid xz dpkg make
          
          # Setup Theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          export THEOS_PACKAGE_SCHEME=rootless
          export TARGET=iphone:clang:latest:15.0
          export ARCHS=arm64e
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          echo "TARGET=iphone:clang:latest:15.0" >> $GITHUB_ENV
          echo "ARCHS=arm64e" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Generate Makefile
        run: |
          # Create a clean Theos Makefile to bypass Xcode entirely
          cat << 'EOF' > Makefile
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64e
          INSTALL_TARGET_PROCESSES = SpringBoard
          THEOS_PACKAGE_SCHEME = rootless

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = ElleKit
          ElleKit_FILES = ellekitc/ellekitc.c ellekitc/JITLess.c ellekitc/routines.s injector/injector.c
          ElleKit_CFLAGS = -fobjc-arc -Iellekitc/include -Iinjector -Iellekit/include
          ElleKit_FRAMEWORKS = Foundation CoreFoundation
          ElleKit_PRIVATE_FRAMEWORKS = 

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

      - name: Compile and Package
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          export THEOS_PACKAGE_SCHEME=rootless
          make clean package DEBUG=0 FINALPACKAGE=1
          
          # Ensure the deb is found even if Theos names it weirdly
          find . -name "*.deb" -exec cp {} ./ellekit-patched.deb \;

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ellekit-theos-rootless
          path: ellekit-patched.deb
