name: Twilihook
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Dylib
        run: |
          cd injector
          clang -dynamiclib -o libinjector.dylib injector.c -I../vendor/include -framework Foundation -framework CoreFoundation -include injector.h

      - name: Package Deb
        run: |
          mkdir -p build_deb/usr/lib/ellekit
          mkdir -p build_deb/DEBIAN
          cp injector/libinjector.dylib build_deb/usr/lib/ellekit/
          chmod 755 build_deb/usr/lib/ellekit/libinjector.dylib
          
          echo "Package: com.twilihook.fix" > build_deb/DEBIAN/control
          echo "Name: ElleKit Fix" >> build_deb/DEBIAN/control
          echo "Version: 1.0.0" >> build_deb/DEBIAN/control
          echo "Architecture: iphoneos-arm64" >> build_deb/DEBIAN/control
          echo "Description: Fixed ElleKit null pointer" >> build_deb/DEBIAN/control
          echo "Maintainer: twilightult" >> build_deb/DEBIAN/control
          echo "Author: twilightult" >> build_deb/DEBIAN/control
          echo "Section: Tweaks" >> build_deb/DEBIAN/control
          
          dpkg-deb -b build_deb ElleKit_Fix.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElleKit-Deb
          path: ElleKit_Fix.deb
