name: Twilihook
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$RUNNER_TEMP/theos
          git clone --recursive https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build Package
        run: |
          cd injector
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElleKit-Deb
          path: injector/packages/*.deb
